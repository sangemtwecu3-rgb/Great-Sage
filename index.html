<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Sage RPG Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; padding: 15px; text-align: center; }
        .card { background: #1e1e1e; padding: 15px; margin: 12px auto; border-radius: 10px; max-width: 420px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, select, button { padding: 10px; margin: 5px; width: 85%; border-radius: 6px; border: none; font-size: 14px; }
        button { background: #007bff; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0056b3; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: left; padding: 5px; }
        .stat-grid label { font-size: 13px; font-weight: bold; }
        .stat-grid input { width: 80%; padding: 5px; }
        canvas { max-width: 350px; margin: 10px auto; }
        .highlight { color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

    <h2>⚡ Great Sage Training Simulator</h2>

    <!-- Character & Stat Configuration -->
    <div class="card">
        <h3>👤 Character Baseline Stats</h3>
        <input type="text" id="charName" placeholder="Player Name" onchange="saveData()">
        <div class="stat-grid">
            <label>Offense: <input type="number" id="offense" value="10" onchange="updateAll()"></label>
            <label>Defense: <input type="number" id="defense" value="10" onchange="updateAll()"></label>
            <label>Speed: <input type="number" id="speed" value="10" onchange="updateAll()"></label>
            <label>Reiatsu: <input type="number" id="reiatsu" value="10" onchange="updateAll()"></label>
            <label>Kidō: <input type="number" id="kido" value="10" onchange="updateAll()"></label>
            <label>Stamina: <input type="number" id="stamina" value="10" onchange="updateAll()"></label>
        </div>
        <button onclick="resetStats()" style="background: #dc3545; width: 50%;">Reset Baseline</button>
    </div>

    <!-- Training & XP Allocation -->
    <div class="card">
        <h3>🎯 XP Allocation</h3>
        <p style="font-size: 12px; color: #aaa;">5 XP = +1 Stat Point</p>
        <input type="number" id="xpInput" placeholder="Enter Earned XP">
        <select id="statTarget">
            <option value="offense">Offense</option>
            <option value="defense">Defense</option>
            <option value="speed">Speed</option>
            <option value="reiatsu">Reiatsu</option>
            <option value="kido">Kidō</option>
            <option value="stamina">Stamina</option>
        </select>
        <button onclick="addXP()">Apply Training XP</button>
        <p>Unused XP Pool: <span id="xpPool" class="highlight">0</span></p>
    </div>

    <!-- Radar Chart Visualizer -->
    <div class="card">
        <canvas id="radarChart"></canvas>
    </div>

    <script>
        const stats = ['offense', 'defense', 'speed', 'reiatsu', 'kido', 'stamina'];
        let chart;

        // Reads URL parameters like ?off=20&def=15
        function loadURLParams() {
            const urlParams = new URLSearchParams(window.location.search);
            let foundParam = false;
            
            const paramMap = {
                offense: urlParams.get('off') || urlParams.get('offense'),
                defense: urlParams.get('def') || urlParams.get('defense'),
                speed: urlParams.get('spd') || urlParams.get('speed'),
                reiatsu: urlParams.get('rei') || urlParams.get('reiatsu'),
                kido: urlParams.get('kid') || urlParams.get('kido'),
                stamina: urlParams.get('sta') || urlParams.get('stamina')
            };

            stats.forEach(s => {
                if (paramMap[s] !== null && paramMap[s] !== undefined) {
                    document.getElementById(s).value = Number(paramMap[s]);
                    foundParam = true;
                }
            });

            if (foundParam) saveData();
        }

        function initChart() {
            const ctx = document.getElementById('radarChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Offense', 'Defense', 'Speed', 'Reiatsu', 'Kidō', 'Stamina'],
                    datasets: [{
                        label: 'Combat Potential',
                        data: stats.map(s => Number(document.getElementById(s).value)),
                        backgroundColor: 'rgba(0, 123, 255, 0.35)',
                        borderColor: '#007bff',
                        pointBackgroundColor: '#007bff'
                    }]
                },
                options: { 
                    scales: { 
                        r: { 
                            beginAtZero: true,
                            grid: { color: '#333' },
                            angleLines: { color: '#444' },
                            ticks: { color: '#888', backdropColor: 'transparent' }
                        } 
                    } 
                }
            });
        }

        function updateAll() {
            const values = stats.map(s => Number(document.getElementById(s).value));
            if (chart) {
                chart.data.datasets[0].data = values;
                chart.update();
            }
            saveData();
        }

        function addXP() {
            const xp = Number(document.getElementById('xpInput').value);
            const target = document.getElementById('statTarget').value;
            let currentPool = Number(localStorage.getItem('xpPool') || 0) + xp;
            
            const pointsToAdd = Math.floor(currentPool / 5);
            const remainder = currentPool % 5;

            if (pointsToAdd > 0) {
                const statElem = document.getElementById(target);
                statElem.value = Number(statElem.value) + pointsToAdd;
            }

            document.getElementById('xpPool').innerText = remainder;
            localStorage.setItem('xpPool', remainder);
            document.getElementById('xpInput').value = '';
            updateAll();
        }

        function saveData() {
            const data = { name: document.getElementById('charName').value };
            stats.forEach(s => data[s] = document.getElementById(s).value);
            localStorage.setItem('greatSageData', JSON.stringify(data));
        }

        function loadData() {
            const saved = JSON.parse(localStorage.getItem('greatSageData') || '{}');
            if (saved.name) document.getElementById('charName').value = saved.name;
            stats.forEach(s => {
                if (saved[s] !== undefined) document.getElementById(s).value = saved[s];
            });
            document.getElementById('xpPool').innerText = localStorage.getItem('xpPool') || 0;
        }

        function resetStats() {
            if (confirm("Reset all character stats back to 10?")) {
                stats.forEach(s => document.getElementById(s).value = 10);
                localStorage.removeItem('greatSageData');
                localStorage.removeItem('xpPool');
                document.getElementById('xpPool').innerText = 0;
                updateAll();
            }
        }

        window.onload = () => {
            loadData();
            loadURLParams();
            initChart();
        };
    </script>
</body>
</html>
